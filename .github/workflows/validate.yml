name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Check runner syntax and help
        run: |
          node --version
          node --check gpt-image/scripts/gpt_image.mjs
          node --check gpt-image/scripts/validate_skill.mjs
          node gpt-image/scripts/validate_skill.mjs
          node gpt-image/scripts/gpt_image.mjs help

      - name: Check guide, prompt fidelity, references, and bounded batch
        run: |
          node gpt-image/scripts/gpt_image.mjs guide
          node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','guide','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); const ratios=j.common_aspect_ratios.map(x=>x.ratio); if(!j.show_once_after_install || !j.present_in_user_language || !['1:1','16:9','9:16','4:3','3:4'].every(x=>ratios.includes(x))) throw new Error('first-run ratio guide failed'); if(!j.quality_phrases.length || !j.examples.codex || !j.examples.reference || !j.examples.antigravity || !j.examples.transparent) throw new Error('first-run examples failed');"
          node gpt-image/scripts/gpt_image.mjs capabilities --json
          node gpt-image/scripts/gpt_image.mjs inspect --input generated-images/subscription-workflow-smoke.png --json
          node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','inspect','--input','generated-images/subscription-workflow-smoke.png','--require-transparency','--json'],{encoding:'utf8'}); if(r.status===0 || !r.stderr.includes('no alpha or transparency chunk')) throw new Error('opaque transparent-output validation failed');"
          node -e "const {spawnSync}=require('node:child_process'); const prompt='KEEP_THIS_PROMPT_EXACTLY: a red circle'; const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','plan','--prompt',prompt,'--reference','generated-images/subscription-workflow-smoke.png','--out','generated-images/ci-fidelity.png','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); const exact='BEGIN USER PROMPT\n'+prompt+'\nEND USER PROMPT'; if(j.prompt!==prompt || !j.bridge_prompt.includes(exact)) throw new Error('prompt fidelity failed'); if(j.bridge_prompt.includes('Requested size or aspect: auto') || j.bridge_prompt.includes('Inspect the generated result')) throw new Error('implicit prompt guidance leaked'); if(j.references.length!==1 || j.attachment_order.length!==1) throw new Error('reference was not attached');"
          node -e "const {spawnSync}=require('node:child_process'); const prompt='Make the center icon green.'; const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','plan','--mode','edit','--prompt',prompt,'--edit-target','generated-images/reference-edit-smoke.png','--reference','generated-images/subscription-workflow-smoke.png','--out','generated-images/ci-follow-up.png','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); if(j.prompt!==prompt || j.operation_mode!=='edit' || j.attachment_order.length!==2 || !j.bridge_prompt.includes('current edit target')) throw new Error('follow-up edit attachment failed');"
          node gpt-image/scripts/gpt_image.mjs plan --mode generate --prompt "Use Image 1 for content and Image 2 for style." --reference generated-images/subscription-workflow-smoke.png --reference-role "content reference" --reference generated-images/subscription-workflow-smoke.png --reference-role "style reference" --avoid "watermark" --exact-text "GPT IMAGE" --out generated-images/ci-reference-plan.png --json
          node gpt-image/scripts/gpt_image.mjs plan --mode edit --prompt "Replace only the center symbol." --edit-target generated-images/subscription-workflow-smoke.png --region "center symbol only" --preserve "background, lighting, crop, and every other detail" --out generated-images/ci-edit-plan.png --json
          node gpt-image/scripts/gpt_image.mjs plan --mode variation --prompt "Create a warmer variation." --edit-target generated-images/subscription-workflow-smoke.png --preserve "subject identity and composition" --background transparent --out generated-images/ci-variation-plan.png --json
          node -e "const {existsSync}=require('node:fs'); const {spawnSync}=require('node:child_process'); const prompt='KEEP_TRANSPARENT_PROMPT_EXACTLY: flat blue robot icon'; const out='generated-images/ci-transparent-plan.png'; const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','plan','--prompt',prompt,'--background','transparent','--out',out,'--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); if(j.prompt!==prompt || j.requested_background!=='transparent' || !j.transparency_validation_required) throw new Error('transparent routing failed'); if(!j.bridge_prompt.includes('User-supplied background: transparent') || !j.bridge_prompt.includes('BEGIN USER PROMPT\n'+prompt+'\nEND USER PROMPT')) throw new Error('transparent prompt fidelity failed'); if(existsSync(out)) throw new Error('transparent plan generated an image');"
          node gpt-image/scripts/gpt_image.mjs batch --manifest .github/fixtures/batch-manifest.json --concurrency 2 --check-only --json
          node -e "const {existsSync}=require('node:fs'); const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','batch','--manifest','.github/fixtures/batch-manifest.json','--concurrency','2','--check-only','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); if(!j.ok || !j.batch || !j.check_only || j.jobs_total!==3 || j.peak_concurrency!==2) throw new Error('bounded batch scheduling failed'); if(j.authentication_checks!==0 || j.diagnostics_run!==false) throw new Error('check-only batch ran an auth or diagnostic gate'); const [watercolor,clay,independent]=j.results; if(watercolor.prompt!=='KEEP_BATCH_PROMPT_EXACTLY: Keep the same design and render it in watercolor style.') throw new Error('per-output prompt fidelity failed'); if(watercolor.operation_mode!=='variation' || clay.operation_mode!=='variation' || independent.operation_mode!=='generate') throw new Error('multi-image workflow routing failed'); if(!watercolor.edit_target || !clay.edit_target || watercolor.edit_target.path!==clay.edit_target.path) throw new Error('shared anchor routing failed'); if(watercolor.attachment_order.length!==1 || clay.attachment_order.length!==2 || clay.references.length!==1 || independent.attachment_order.length!==0) throw new Error('reference attachment order failed'); if(!j.shared_read_only_inputs_allowed || j.output_dependencies_in_same_batch!==false) throw new Error('batch dependency contract failed'); if(['generated-images/ci-shared-watercolor.png','generated-images/ci-shared-clay.png','generated-images/ci-independent-poster.png'].some(existsSync)) throw new Error('check-only batch generated an image');"
          node gpt-image/scripts/gpt_image.mjs batch --manifest .github/fixtures/delegated-concepts-manifest.json --concurrency 4 --check-only --json
          node -e "const {existsSync}=require('node:fs'); const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','batch','--manifest','.github/fixtures/delegated-concepts-manifest.json','--concurrency','4','--check-only','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); if(!j.ok || j.jobs_total!==5 || j.peak_concurrency!==4) throw new Error('delegated concept scheduling failed'); const prompts=j.results.map(x=>x.prompt); if(new Set(prompts).size!==5) throw new Error('delegated concepts were not distinct'); const forbidden=/(this (?:job|task|image)|(?:first|second|third|fourth|fifth) of five|[1-5](?:st|nd|rd|th)[ ]+(?:option|concept)|이 작업|[1-5][ ]*번째[ ]*시안|5[ ]*장|각각[ ]*다른[ ]*디자인)/i; if(prompts.some(x=>forbidden.test(x))) throw new Error('ordinal or batch metadata leaked into an image prompt'); const refs=j.results.map(x=>x.references[0]?.path); if(refs.some(x=>!x) || new Set(refs).size!==1) throw new Error('shared product reference was not retained'); if(j.results.some(x=>existsSync(x.path))) throw new Error('delegated-concept check generated an image');"

      - name: Check non-destructive host installation
        run: |
          node gpt-image/scripts/gpt_image.mjs install --target all --dry-run --json
          node gpt-image/scripts/gpt_image.mjs install --target all --json
          node gpt-image/scripts/gpt_image.mjs install --target all --dry-run --json
          node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['gpt-image/scripts/gpt_image.mjs','install','--target','all','--dry-run','--json'],{encoding:'utf8'}); if(r.status!==0) throw new Error(r.stderr); const j=JSON.parse(r.stdout); if(j.installations.length!==3 || !j.installations.some(x=>x.target.includes('.gemini') && x.target.includes('config') && x.target.endsWith('gpt-image'))) throw new Error('Antigravity global skill target failed');"
          node gpt-image/scripts/gpt_image.mjs install --target antigravity --dry-run --json

  installer-contract:
    name: Verify official Codex installers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify installer redirects and signatures
        run: node gpt-image/scripts/gpt_image.mjs verify-installers --json
