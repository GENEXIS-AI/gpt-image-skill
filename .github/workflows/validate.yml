name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Check runner syntax and help
        run: |
          node --version
          node --check gpt-image/scripts/gpt_image.mjs
          node --check gpt-image/scripts/validate_skill.mjs
          node gpt-image/scripts/validate_skill.mjs
          node gpt-image/scripts/gpt_image.mjs help

      - name: Check image capability and reference contracts
        run: |
          node gpt-image/scripts/gpt_image.mjs capabilities --json
          node gpt-image/scripts/gpt_image.mjs inspect --input generated-images/subscription-workflow-smoke.png --json
          node gpt-image/scripts/gpt_image.mjs plan --mode generate --prompt "Use Image 1 for content and Image 2 for style." --reference generated-images/subscription-workflow-smoke.png --reference-role "content reference" --reference generated-images/subscription-workflow-smoke.png --reference-role "style reference" --avoid "watermark" --exact-text "GPT IMAGE" --out generated-images/ci-reference-plan.png --json
          node gpt-image/scripts/gpt_image.mjs plan --mode edit --prompt "Replace only the center symbol." --edit-target generated-images/subscription-workflow-smoke.png --region "center symbol only" --preserve "background, lighting, crop, and every other detail" --out generated-images/ci-edit-plan.png --json
          node gpt-image/scripts/gpt_image.mjs plan --mode variation --prompt "Create a warmer variation." --edit-target generated-images/subscription-workflow-smoke.png --preserve "subject identity and composition" --background transparent --out generated-images/ci-variation-plan.png --json

      - name: Check non-destructive host installation
        run: |
          node gpt-image/scripts/gpt_image.mjs install --target all --dry-run --json
          node gpt-image/scripts/gpt_image.mjs install --target all --json
          node gpt-image/scripts/gpt_image.mjs install --target all --dry-run --json

  installer-contract:
    name: Verify official Codex installers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify installer redirects and signatures
        run: node gpt-image/scripts/gpt_image.mjs verify-installers --json
